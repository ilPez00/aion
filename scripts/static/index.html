<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aion HUD</title>
<!-- PWA: installable web HUD (Add to Home Screen -> standalone app) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5ad1ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AION">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/hud.css">
</head>
<body>
<div id="app">

  <!-- ── rail: modules + always-on vitals ─────────────────────────────── -->
  <nav id="rail" aria-label="Modules">
    <div id="brand"><span>AION</span></div>
    <div id="nav" role="tablist"></div>
    <div id="vitals" aria-label="System vitals">
      <div class="vital"><span class="k">CPU</span><span class="meter"><i id="m-cpu"></i></span><span class="v" id="v-cpu">–</span></div>
      <div class="vital"><span class="k">RAM</span><span class="meter"><i id="m-mem"></i></span><span class="v" id="v-mem">–</span></div>
      <div class="vital"><span class="k">DSK</span><span class="meter"><i id="m-dsk"></i></span><span class="v" id="v-dsk">–</span></div>
      <div class="vital"><span class="k">GPU</span><span class="meter"><i id="m-gpu"></i></span><span class="v" id="v-gpu">–</span></div>
    </div>
  </nav>

  <!-- ── workspace ────────────────────────────────────────────────────── -->
  <div id="work">
    <div id="topbar">
      <h2 id="module-title">FILES</h2>

      <div id="graph-tools" class="row">
        <button id="pal-open" type="button" title="Search everything (Ctrl-K)">Search <kbd>^K</kbd></button>
        <button id="voice-btn" type="button" aria-pressed="false"
                title="Voice control (v) — keeps listening, drives the whole HUD">MIC</button>
        <button id="mute-btn" type="button" aria-pressed="false"
                title="Speak replies aloud">SPEAK</button>
        <button id="view-toggle" type="button" aria-pressed="false" title="Show list view"></button>
        <label class="sr-only" for="detail">Graph detail</label>
        <select id="detail" title="How many nodes to draw at once (d cycles)">
          <option value="sparse">sparse</option>
          <option value="normal" selected>normal</option>
          <option value="dense">dense</option>
          <option value="all">all</option>
        </select>
        <button id="fit" type="button" title="Fit graph to screen (0)">Fit</button>
        <button id="refresh" type="button" title="Rescan (r)">Refresh</button>
        <button id="mesh-btn" type="button" title="Randomesh AI fabric status">MESH</button>
        <label class="sr-only" for="search">Filter nodes</label>
        <input id="search" type="search" placeholder="filter… (/)" style="max-width:180px">
      </div>

      <div id="fs-tools" class="row" hidden>
        <label class="sr-only" for="roots">Bookmarked directory</label>
        <select id="roots" title="Jump to a bookmarked directory"></select>
        <label class="sr-only" for="dir">Directory to scan</label>
        <input id="dir" type="text" placeholder="/absolute/path" style="min-width:200px">
        <label class="sr-only" for="depth">Scan depth</label>
        <select id="depth" title="Scan depth">
          <option value="1">depth 1</option>
          <option value="2">depth 2</option>
          <option value="3" selected>depth 3</option>
          <option value="5">depth 5</option>
        </select>
        <label class="row mono-sm muted" style="gap:6px">
          <input id="hidden" type="checkbox" style="min-height:auto;width:16px;height:16px"> hidden
        </label>
      </div>

      <div id="agent-tools" class="row" hidden>
        <button id="swarm-plan" type="button"
                title="Describe a goal; a DAG is proposed for you to review">plan</button>
        <button id="swarm-add" type="button"
                title="Add a swarm agent (its name is how others depend on it)">+ agent</button>
        <button id="swarm-run" type="button"
                title="Start every agent whose dependencies are done">run ready</button>
        <button id="swarm-stop" type="button" title="Cancel everything in flight">stop all</button>
      </div>

      <span class="grow"></span>
      <span id="live-dot" class="live-dot" title="offline — polling" aria-hidden="true"></span>
      <span id="status" class="muted" role="status" aria-live="polite">booting…</span>
    </div>

    <!-- Approval gates block a task and fail closed, so they interrupt every
         module rather than living in one panel. -->
    <div id="gate-bar" role="alert" aria-live="assertive" hidden></div>

    <nav id="crumbs" aria-label="Directory path" hidden></nav>

    <div id="stage">
      <div id="canvas-wrap">
        <!-- The graph. role=application + tabindex makes arrow-key traversal
             reachable; #graph-desc is the live text description, and the
             list view (below) is the real accessible peer. -->
        <canvas id="graph-canvas" tabindex="0" role="application"
                aria-label="Organic relationship graph"
                aria-describedby="graph-desc"></canvas>
        <p id="graph-desc" class="sr-only" role="status" aria-live="polite"></p>
        <div id="focus-badge" role="status" hidden></div>
        <!-- The graph draws what fits and defers the rest. Hiding nodes
             silently would leave no way to tell a small graph from a big one
             drawn small, so the count is always on screen. -->
        <div id="lod-badge" role="status" hidden></div>
        <div id="voice-hud" class="voice-hud" role="status" aria-live="polite" hidden></div>
        <!-- Routing a task is remote code execution: the drop only plans,
             this confirms, and the server refuses to dispatch without it. -->
        <div id="route-confirm" role="alertdialog" aria-label="Confirm routing" hidden></div>
        <div id="legend" aria-hidden="true"></div>
        <div id="hint">drag · scroll zoom · click a hub to isolate · 0 fit</div>

        <!-- accessible twin of the graph -->
        <div id="list-view"></div>

        <!-- sheet modules (Desk, Board, Term, Settings): a card surface -->
        <div id="sheet"></div>

        <!-- non-graph modules mount here -->
        <div id="panel-view">
          <div id="chat-root" style="display:flex;flex-direction:column;min-height:0;height:100%">
            <div id="messages" role="log" aria-label="Agent conversation" aria-live="polite"></div>
            <div id="composer">
              <label class="sr-only" for="chat-input">Message the agent</label>
              <input id="chat-input" type="text" placeholder="Message Aion…" autocomplete="off">
              <button id="dictate-btn" type="button" aria-label="Dictate into the message box">MIC</button>
              <button id="send" type="button" class="primary">Send</button>
            </div>
          </div>
          <div id="latex-root" hidden style="padding:16px;overflow:auto;width:100%">
            <label class="sr-only" for="latex-area">LaTeX source</label>
            <textarea id="latex-area" placeholder="\documentclass{article}
\begin{document}
Hello
\end{document}"></textarea>
            <div class="row" style="margin-top:12px">
              <button id="latex-compile" type="button" class="primary">Compile</button>
              <span id="latex-log" class="muted mono-sm"></span>
            </div>
            <iframe id="latex-preview" title="Compiled PDF" hidden
                    style="width:100%;height:60vh;margin-top:12px;border:1px solid var(--border);border-radius:8px;background:#fff"></iframe>
          </div>
        </div>
      </div>

      <!-- ── inspector ──────────────────────────────────────────────── -->
      <aside id="inspector" aria-label="Selection inspector">
        <div class="pane row">
          <h3 style="flex:1;margin:0">Inspector</h3>
          <button id="inspector-close" type="button" style="display:none" aria-label="Close inspector">✕</button>
        </div>
        <div class="pane">
          <h3>Selection</h3>
          <div id="sel-body"><p class="muted">Select a node.</p></div>
          <!-- Agent control. Every button here asks a live cockpit over the
               authenticated transport; the HUD never runs a harness itself,
               which is what keeps approval gates meaningful. -->
          <div id="agent-box" class="pane" hidden></div>
          <div id="open-box" hidden style="margin-top:12px">
            <button id="open-editor" type="button">Open in editor</button>
          </div>
          <div id="move-box" hidden style="margin-top:12px">
            <label class="mono-sm muted" for="dest">Rename / move to</label>
            <div class="row" style="margin-top:6px">
              <input id="dest" type="text" spellcheck="false">
              <button id="move" type="button">Move</button>
            </div>
          </div>
        </div>
        <!-- Swarm condition. Not selection-driven: a DAG's budget, its slot
             limits and its dead letters are standing facts about the run, and
             they were previously visible only as a refusal after the fact. -->
        <div class="pane" id="swarm-box" hidden></div>
        <div class="pane" id="preview-pane">
          <h3>Preview</h3>
          <pre id="preview">—</pre>
        </div>
      </aside>
    </div>
  </div>
</div>

<!-- Command palette: one search across modules, harnesses, tasks, task logs,
     notes, filenames and file contents. Ctrl-K, same as the TUI cockpit. -->
<div id="palette" hidden>
  <div id="pal-box" role="combobox" aria-expanded="true" aria-haspopup="listbox"
       aria-owns="pal-list">
    <div id="pal-head">
      <label class="sr-only" for="pal-input">Search everything</label>
      <input id="pal-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="search files, tasks, notes, harnesses…"
             aria-controls="pal-list" aria-autocomplete="list">
      <span id="pal-count" class="muted mono-sm"></span>
    </div>
    <div id="pal-list" role="listbox" aria-label="Search results"></div>
    <div id="pal-foot" class="muted mono-sm">
      <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>⏎</kbd> jump · <kbd>esc</kbd> close
    </div>
  </div>
</div>

<div id="randomesh-panel" hidden role="dialog" aria-label="Randomesh AI fabric"
     style="position:fixed;right:12px;bottom:12px;width:min(480px,94vw);max-height:80vh;overflow:auto;background:var(--bg,#111);border:1px solid var(--border,#333);border-radius:12px;padding:12px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.55)">
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
    <strong>Randomesh · AI fabric</strong>
    <button id="mesh-close" type="button" aria-label="Close">✕</button>
  </div>
  <div class="mesh-body mono-sm"></div>
</div>
<style>
  #randomesh-panel table.mesh {border-collapse:collapse;width:100%;margin:4px 0 10px}
  #randomesh-panel table.mesh th, #randomesh-panel table.mesh td
    {text-align:left;padding:2px 6px;border-bottom:1px solid var(--border,#333);font-size:12px;vertical-align:top}
  #randomesh-panel h4 {margin:10px 0 2px}
  #randomesh-panel .ok {color:#5ad1ff;font-weight:700}
  #randomesh-panel .down {color:#ff6b6b}
</style>
<script src="/static/organic.js"></script>
<script src="/static/hud.js"></script>
<script>
(function () {
  const btn = document.getElementById('mesh-btn');
  const panel = document.getElementById('randomesh-panel');
  const close = document.getElementById('mesh-close');
  if (!btn || !panel) return;
  const body = () => panel.querySelector('.mesh-body');
  const SECTIONS = ['machines', 'services', 'programs', 'configs', 'network', 'agents'];
  const LABELS = { machines: 'Machines', services: 'Services', programs: 'Programs',
                   configs: 'Configs', network: 'Network', agents: 'Agents' };
  let section = 'machines';
  let data = null;

  btn.addEventListener('click', () => { panel.hidden = !panel.hidden; if (!panel.hidden) refresh(); });
  close.addEventListener('click', () => { panel.hidden = true; });
  document.addEventListener('keydown', (e) => {
    if (!panel.hidden && e.key === 'Escape') panel.hidden = true;
  });

  function post(payload) {
    return { method: 'POST', headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify(payload) };
  }
  async function refresh() {
    try {
      data = await (await fetch('/api/mesh/snapshot')).json();
      render();
    } catch (e) { body().innerHTML = '<p class="muted">mesh feed offline</p>'; }
  }
  async function act(name, action) {
    const pv = await (await fetch('/api/mesh/action', post({ service: name, action, confirm: false }))).json();
    if (!pv.ok) { flash(pv.error || 'preview failed'); return; }
    if (pv.refused_reason) { flash(`${action} ${name}: ${pv.refused_reason}`); return; }
    if (!window.confirm(`${action.toUpperCase()} ${name} @ ${pv.host}\n\n${pv.command}`)) return;
    const r = await (await fetch('/api/mesh/action', post({ service: name, action, confirm: true }))).json();
    flash(r.ok ? `${action} ${name}: ok${r.out ? ' — ' + r.out : ''}`
               : `${action} ${name}: ${r.error || ('rc=' + r.rc)}`);
    setTimeout(refresh, 1500);
  }
  function flash(msg) {
    let bar = panel.querySelector('#mesh-flash');
    if (!bar) { bar = document.createElement('div'); bar.id = 'mesh-flash';
      bar.style.cssText = 'margin:6px 0;padding:4px 8px;border:1px solid var(--border,#333);border-radius:6px;font-size:12px';
      body().prepend(bar); }
    bar.textContent = msg;
  }

  const esc = (v) => v === undefined || v === null ? '–' :
    String(v).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const ago = (s) => s ? Math.round(s / 3600) + 'h' : '–';

  function render() {
    if (!data) return;
    let h = '<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:8px">' +
      SECTIONS.map((s) => `<button class="mesh-tab" data-s="${s}" style="${s === section ? 'font-weight:700' : ''}">${LABELS[s]}</button>`).join('') +
      `<span class="grow"></span><span class="muted mono-sm">${data.source} · ${data.generated ? new Date(data.generated * 1000).toLocaleTimeString() : ''}</span></div>`;
    h += '<div class="mesh-view">' + VIEWS[section](data) + '</div>';
    body().innerHTML = h;
    body().querySelectorAll('.mesh-tab').forEach((t) =>
      t.addEventListener('click', () => { section = t.dataset.s; render(); }));
    body().querySelectorAll('button[data-act]').forEach((b) =>
      b.addEventListener('click', () => act(b.dataset.svc, b.dataset.act)));
    const rb = body().querySelector('#mesh-resweep');
    if (rb) rb.addEventListener('click', async () => {
      rb.textContent = 'sweeping…';
      try { await fetch('/api/mesh/snapshot'); } catch (e) {}
      refresh();
    });
  }

  const up = (b) => b ? '<span class="ok">UP</span>' : '<span class="down">DOWN</span>';
  const VIEWS = {
    machines: (d) => '<table class="mesh"><tr><th>node</th><th>hw</th><th>state</th></tr>' +
      d.machines.map((m) => `<tr><td>${esc(m.name)}<br><span class="muted mono-sm">${esc(m.role)}</span></td>` +
        `<td class="mono-sm">${esc((m.cpu || '').split(' with')[0])} · ${esc(m.cores)}c · ${esc(Math.round((m.ram_avail_mb || 0) / 1024))}/${esc(Math.round((m.ram_total_mb || 0) / 1024))}G free${m.gpus && m.gpus.length ? '<br>' + esc(m.gpus[0]).split('[')[0] : ''}` +
        (m.disks || []).map((dk) => `<br>${esc(dk.mount)} ${esc(dk.pct)}%`).join('') + '</td>' +
        `<td>${up(m.online)}${m.error ? '<br><span class="muted mono-sm">' + esc(m.error) + '</span>' : ''}</td></tr>`).join('') +
      '</table>',
    services: (d) => '<table class="mesh"><tr><th>service</th><th>host</th><th>state</th><th>control</th></tr>' +
      d.services.map((s) => `<tr><td>${esc(s.name)}${s.critical ? ' <span class="ok">*</span>' : ''}<br><span class="muted mono-sm">${esc(s.note)}</span></td>` +
        `<td class="mono-sm">${esc(s.host)}</td><td><span class="${s.state === 'active' ? 'ok' : (s.state === 'down' || s.state === 'failed' ? 'down' : 'muted')}">${esc(s.state)}</span>${s.sub ? ' <span class="muted mono-sm">' + esc(s.sub) + '</span>' : ''}</td>` +
        `<td>${['start', 'stop', 'restart', 'enable', 'disable'].map((a) => `<button data-act="${a}" data-svc="${esc(s.name)}" style="margin:1px;padding:1px 5px;font-size:11px">${a}</button>`).join('')}</td></tr>`).join('') +
      '</table><p class="muted mono-sm">* critical — degrading it degrades other nodes. Buttons ask for confirmation and show the exact command first.</p>',
    programs: (d) => d.programs.map((p) => {
      const keys = ['opencode', 'hermes', 'cline', 'node', 'python3', 'cargo', 'ollama', 'caddy'];
      return '<h4 style="margin:8px 0 2px">' + esc(p.name) + '</h4><table class="mesh">' +
        '<tr><th>packages</th><th>ai models</th><th>toolchain</th></tr><tr>' +
        `<td class="mono-sm">${esc((p.packages || {}).manager || '–')}: ${esc((p.packages || {}).explicit || '–')}<br>llama: ${esc((p.llama_builds || []).join(', ') || '–')}</td>` +
        `<td class="mono-sm">${esc((p.ollama_models || []).join('<br>') || '–')}</td>` +
        `<td class="mono-sm">${keys.map((k) => ((p.programs || {})[k]) ? `${k} ${esc(String((p.programs || {})[k]).split(' ')[0])}` : null).filter(Boolean).join('<br>')}</td></tr></table>`;
    }).join(''),
    configs: (d) => '<table class="mesh"><tr><th>node</th><th>clones</th><th>randomesh drift</th></tr>' +
      d.configs.map((c) => `<tr><td>${esc(c.name)}</td><td class="mono-sm">randomesh ${c.randomesh_clone ? '✓' : '✗'} · aion ${c.aion_clone ? '✓' : '✗'} · FLEET.md ${c.fleet_md ? '✓' : '✗'}</td>` +
        `<td>${c.randomesh_dirty > 0 ? `<span class="down">${esc(c.randomesh_dirty)} uncommitted</span>` : '<span class="ok">clean</span>'}</td></tr>`).join('') + '</table>',
    network: (d) => '<table class="mesh"><tr><th>node</th><th>tailscale</th><th>peers</th><th>ports</th></tr>' +
      d.network.map((n) => `<tr><td>${esc(n.name)}</td><td>${n.ts_up ? '<span class="ok">up</span>' : '<span class="down">down</span>'} <span class="mono-sm">${esc(n.self_ip)}</span></td>` +
        `<td class="mono-sm">${esc((n.peers_online || []).join(', ') || '–')} / ${esc(n.peers_total)}</td>` +
        `<td class="mono-sm">${esc((n.listening_ports || []).slice(0, 10).join(', '))}${(n.listening_ports || []).length > 10 ? '…' : ''}</td></tr>`).join('') + '</table>',
    agents: (d) => d.agents.length
      ? '<pre class="mono-sm" style="white-space:pre-wrap;margin:4px 0">' + esc(d.agents.join('\n')) + '</pre>'
      : '<p class="muted">no agent task records</p>',
  };

  render();
  let loadInterval = setInterval(() => { if (!panel.hidden) refresh(); }, 15000);
  refresh();
})();
</script>
</body>
</html>
