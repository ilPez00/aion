<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aion HUD</title>
<!-- PWA: installable web HUD (Add to Home Screen -> standalone app) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16f0c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AION">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #0d0d12;
  --bg2: #16161e;
  --bg3: #1e1e2a;
  --fg: #cdd6f4;
  --fg2: #a6adc8;
  --accent: #89b4fa;
  --accent2: #74c7ec;
  --green: #a6e3a1;
  --red: #f38ba8;
  --yellow: #f9e2af;
  --border: #2a2a3a;
  --radius: 8px;
  --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; }
input, textarea, select, button { font-family: var(--font); }
button { cursor: pointer; border: none; background: var(--accent); color: var(--bg); padding: 6px 14px; border-radius: var(--radius); font-weight: 600; }
button:hover { filter: brightness(1.15); }
button:disabled { opacity: 0.4; cursor: default; }

/* layout */
#app { display: flex; height: 100vh; }
#sidebar { width: 260px; min-width: 200px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#sidebar-header { padding: 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
#sidebar-header h1 { font-size: 15px; flex: 1; }
#session-list { flex: 1; overflow-y: auto; padding: 4px; }
.session-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.session-item:hover { background: var(--bg3); color: var(--fg); }
.session-item.active { background: var(--accent); color: var(--bg); }
#main { flex: 1; display: flex; flex-direction: column; position: relative; }
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--bg); }
.msg.assistant { align-self: flex-start; background: var(--bg3); border: 1px solid var(--border); }
.msg.system { align-self: center; background: var(--bg2); color: var(--fg2); font-size: 12px; border: 1px solid var(--border); }
.msg .streaming-cursor { animation: blink 0.8s infinite; }
@keyframes blink { 50% { opacity: 0; } }
#input-bar { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--bg2); }
#input-bar input { flex: 1; background: var(--bg3); border: 1px solid var(--border); color: var(--fg); padding: 8px 12px; border-radius: var(--radius); outline: none; }
#input-bar input:focus { border-color: var(--accent); }
#voice-btn { background: var(--bg3); color: var(--fg2); padding: 6px 10px; border-radius: 50%; font-size: 18px; }
#voice-btn.listening { background: var(--red); color: white; }

/* panels */
#right-panel { width: 0; overflow: hidden; transition: width 0.2s; background: var(--bg2); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
#right-panel.open { width: 360px; min-width: 300px; }
#right-panel-header { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; }
#right-panel-header select { background: var(--bg3); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; }
#right-panel-content { flex: 1; overflow-y: auto; padding: 12px; }

/* system stats */
.stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.stat-row .label { color: var(--fg2); }
.stat-row .value { color: var(--fg); font-weight: 600; }
.bar { height: 4px; border-radius: 2px; margin-top: 2px; background: var(--bg3); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

/* files */
.file-entry { padding: 4px 8px; font-size: 13px; cursor: pointer; border-radius: 4px; display: flex; gap: 6px; }
.file-entry:hover { background: var(--bg3); }
.file-entry.dir { color: var(--accent); }
.file-entry.file { color: var(--fg2); }
#file-preview { margin-top: 8px; padding: 8px; background: var(--bg3); border-radius: var(--radius); font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow: auto; }

/* notes graph */
#graph-svg { width: 100%; height: 300px; }
#graph-svg .node circle { cursor: pointer; }
#graph-svg .node text { fill: var(--fg); font-size: 10px; pointer-events: none; }
#graph-svg line { stroke: var(--border); stroke-width: 1; }

/* latex */
#latex-area { width: 100%; height: 120px; background: var(--bg3); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; font-family: var(--font); font-size: 12px; resize: vertical; }
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Aion</h1>
      <button onclick="newSession()" title="New chat">+</button>
    </div>
    <div id="session-list"></div>
  </div>
  <!-- Main -->
  <div id="main">
    <div id="messages"></div>
    <div id="input-bar">
      <input id="chat-input" type="text" placeholder="Message Aion..." autofocus>
      <button id="voice-btn" onclick="toggleVoice()" title="Voice input">🎤</button>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
  <!-- Right panel -->
  <div id="right-panel">
    <div id="right-panel-header">
      <select id="panel-mode" onchange="switchPanel()">
        <option value="stats">Stats</option>
        <option value="files">Files</option>
        <option value="notes">Notes</option>
        <option value="latex">LaTeX</option>
      </select>
      <button onclick="togglePanel()">✕</button>
    </div>
    <div id="right-panel-content"></div>
  </div>
</div>
<script>
// ---- state ----
let sessionId = null;
let streaming = false;
let aborter = null;
let panelOpen = true;

// WebSocket connections
let evtWs = null;
let termWs = null;

// ---- init ----
async function init() {
  const res = await fetch('/api/sessions');
  const data = await res.json();
  renderSessions(data.sessions);
  if (data.sessions.length) {
    await loadSession(data.sessions[0].id);
  } else {
    await newSession();
  }
  connectEventWs();
  startSystemPoll();
}
init();

// ---- sessions ----
function renderSessions(sessions) {
  const el = document.getElementById('session-list');
  el.replaceChildren(...sessions.map(s =>
    entry('session-item', s.title, () => loadSession(s.id),
          {title: s.title, active: s.id === sessionId})
  ));
}

async function loadSession(sid) {
  sessionId = sid;
  const res = await fetch(`/api/session?id=${sid}`);
  const sess = await res.json();
  renderMessages(sess.messages || []);
  document.getElementById('session-list').querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.textContent.trim() === (sess.title || 'Chat'));
  });
}

async function newSession() {
  const res = await fetch('/api/session/new');
  const data = await res.json();
  sessionId = data.id;
  renderMessages([]);
  // refresh sidebar
  const r2 = await fetch('/api/sessions');
  const d2 = await r2.json();
  renderSessions(d2.sessions);
}

// ---- messages ----
function renderMessages(msgs) {
  const el = document.getElementById('messages');
  el.replaceChildren(...msgs.map(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + m.role;   // className assignment, not HTML parsing
    div.textContent = m.content;       // never parsed as markup
    return div;
  }));
  el.scrollTop = el.scrollHeight;
}

function appendMessage(role, content) {
  const el = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  return div;
}

// ---- chat (SSE) ----
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = '';
  appendMessage('user', text);

  streaming = true;
  const msgEl = appendMessage('assistant', '');
  const cursor = document.createElement('span');
  cursor.className = 'streaming-cursor';
  cursor.textContent = '▊';
  msgEl.appendChild(cursor);

  const url = `/api/agent/stream?session=${encodeURIComponent(sessionId)}&text=${encodeURIComponent(text)}`;
  const evtSource = new EventSource(url);
  let full = '';

  aborter = evtSource;
  evtSource.addEventListener('token', e => {
    try {
      const d = JSON.parse(e.data);
      if (d.token) {
        full += d.token;
        msgEl.textContent = full;
        msgEl.appendChild(cursor);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
      }
    } catch(err) {}
  });
  evtSource.addEventListener('done', e => {
    evtSource.close();
    streaming = false;
    msgEl.removeChild(cursor);
    // refresh sessions to update title
    fetch('/api/sessions').then(r => r.json()).then(d => renderSessions(d.sessions));
  });
  evtSource.onerror = () => {
    evtSource.close();
    streaming = false;
    if (msgEl.contains(cursor)) msgEl.removeChild(cursor);
  };
}

document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ---- voice (Web Speech API) ----
let recognition = null;
let voiceListening = false;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('Voice input not supported in this browser.');
    return;
  }
  if (voiceListening) {
    if (recognition) recognition.stop();
    voiceListening = false;
    document.getElementById('voice-btn').classList.remove('listening');
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  let silenceTimer = null;
  let finalText = '';

  recognition.onresult = (event) => {
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => { recognition.stop(); }, 1500);

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        finalText += (finalText ? ' ' : '') + result[0].transcript;
        document.getElementById('chat-input').value = finalText;
      } else {
        document.getElementById('chat-input').value = finalText + result[0].transcript;
      }
    }
  };

  recognition.onend = () => {
    voiceListening = false;
    document.getElementById('voice-btn').classList.remove('listening');
    if (finalText.trim()) sendMessage();
    finalText = '';
  };

  recognition.onerror = () => {
    voiceListening = false;
    document.getElementById('voice-btn').classList.remove('listening');
  };

  voiceListening = true;
  document.getElementById('voice-btn').classList.add('listening');
  finalText = '';
  recognition.start();
}

// ---- right panel ----
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('right-panel').classList.toggle('open', panelOpen);
}

async function switchPanel() {
  const mode = document.getElementById('panel-mode').value;
  const content = document.getElementById('right-panel-content');
  panelOpen = true;
  document.getElementById('right-panel').classList.add('open');

  if (mode === 'stats') {
    content.innerHTML = '<div id="stats-panel"></div>';
    updateStats();
  } else if (mode === 'files') {
    await renderFiles('/home/gio');
  } else if (mode === 'notes') {
    await renderNotes();
  } else if (mode === 'latex') {
    content.innerHTML = `
      <textarea id="latex-area" placeholder="\\documentclass{article}\n\\begin{document}\nHello\n\\end{document}"></textarea>
      <div style="margin-top:8px;display:flex;gap:6px;">
        <button onclick="compileLatex()">Compile</button>
        <button onclick="clearLatex()">Clear</button>
      </div>
      <div id="latex-log" style="margin-top:8px;font-size:12px;color:var(--fg2);"></div>
      <iframe id="latex-preview" style="width:100%;height:400px;margin-top:8px;border:1px solid var(--border);border-radius:var(--radius);background:white;" hidden></iframe>
    `;
  }
}

// system stats
let statsInterval = null;
function startSystemPoll() {
  updateStats();
  statsInterval = setInterval(updateStats, 2000);
}

async function updateStats() {
  const el = document.getElementById('stats-panel');
  if (!el) return;
  const res = await fetch('/api/system');
  const s = await res.json();
  el.innerHTML = `
    <div class="stat-row"><span class="label">Time</span><span class="value">${s.time}</span></div>
    <div class="stat-row"><span class="label">Date</span><span class="value">${s.date}</span></div>
    <div class="stat-row"><span class="label">CPU</span><span class="value">${s.cpu}%</span></div>
    <div class="bar"><div class="bar-fill" style="width:${s.cpu}%;background:var(--accent)"></div></div>
    <div class="stat-row"><span class="label">RAM</span><span class="value">${s.mem}%</span></div>
    <div class="bar"><div class="bar-fill" style="width:${s.mem}%;background:var(--yellow)"></div></div>
    <div class="stat-row"><span class="label">Disk</span><span class="value">${s.disk}%</span></div>
    <div class="bar"><div class="bar-fill" style="width:${s.disk}%;background:var(--green)"></div></div>
    ${s.gpu ? `
    <div class="stat-row"><span class="label">GPU</span><span class="value">${s.gpu.util}% (${s.gpu.mem_mb}/${s.gpu.mem_total_mb}MB)</span></div>
    <div class="bar"><div class="bar-fill" style="width:${s.gpu.util}%;background:var(--red)"></div></div>
    ` : ''}
    <div class="stat-row"><span class="label">Net Up</span><span class="value">${fmtBytes(s.net_up)}</span></div>
    <div class="stat-row"><span class="label">Net Down</span><span class="value">${fmtBytes(s.net_down)}</span></div>
  `;
}

function fmtBytes(b) {
  if (b > 1e9) return (b/1e9).toFixed(1) + ' GB';
  if (b > 1e6) return (b/1e6).toFixed(1) + ' MB';
  if (b > 1e3) return (b/1e3).toFixed(1) + ' KB';
  return b + ' B';
}

// files
async function renderFiles(path) {
  const content = document.getElementById('right-panel-content');
  content.innerHTML = '<div id="file-browser"></div><div id="file-preview"></div>';
  const res = await fetch(`/api/files?path=${encodeURIComponent(path)}`);
  const data = await res.json();
  const browser = document.getElementById('file-browser');
  const rows = [entry('file-entry dir', '📁 ~', () => renderFiles('/home/gio'))];
  if (path !== '/home/gio') {
    const parent = path.substring(0, path.lastIndexOf('/'));
    rows.push(entry('file-entry dir', '📁 ..', () => renderFiles(parent)));
  }
  for (const n of (data.nodes || []).slice(1)) {  // skip root
    const icon = n.kind === 'dir' ? '📁' : '📄';
    const fullPath = path + '/' + n.id;
    const go = n.kind === 'dir' ? () => renderFiles(fullPath)
                                : () => previewFile(fullPath);
    rows.push(entry('file-entry ' + n.kind, `${icon} ${n.id}`, go));
  }
  browser.replaceChildren(...rows);
}

async function previewFile(path) {
  const el = document.getElementById('file-preview');
  try {
    const res = await fetch(path.startsWith('/') ? `/api/files?path=${encodeURIComponent(path)}` : path);
    const text = await res.text();
    el.textContent = text.substring(0, 2000);
  } catch(e) {
    el.textContent = '(error loading)';
  }
}

// notes
async function renderNotes() {
  const content = document.getElementById('right-panel-content');
  const res = await fetch('/api/notes');
  const data = await res.json();
  const nodes = data.nodes || [];
  const edges = data.edges || [];

  // simple text graph
  const header = document.createElement('div');
  header.style.marginBottom = '8px';
  header.innerHTML = '<b>Vault</b>';
  const rows = [header];
  for (const n of nodes) {
    rows.push(entry('file-entry note', `📝 ${n.label}`, () => loadNote(n.id)));
  }
  const noteContent = document.createElement('div');
  noteContent.id = 'note-content';
  noteContent.style.cssText = 'margin-top:8px;background:var(--bg3);padding:8px;border-radius:var(--radius);font-size:12px;white-space:pre-wrap;';
  rows.push(noteContent);
  content.replaceChildren(...rows);
  loadNote(nodes[0]?.id || 'welcome');
}

async function loadNote(name) {
  const el = document.getElementById('note-content');
  if (!el) return;
  try {
    const res = await fetch(`/api/notes/content?name=${encodeURIComponent(name)}`);
    const data = await res.json();
    el.textContent = data.text || '# (empty)';
  } catch(e) {
    el.textContent = '# (error)';
  }
}

// latex
async function compileLatex() {
  const src = document.getElementById('latex-area')?.value;
  if (!src) return;
  const log = document.getElementById('latex-log');
  const preview = document.getElementById('latex-preview');
  log.textContent = 'Compiling...';
  try {
    const res = await fetch('/api/latex', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({src}) });
    const data = await res.json();
    if (data.ok && data.pdf) {
      log.textContent = 'OK';
      preview.hidden = false;
      preview.src = data.pdf + '?' + Date.now();
    } else {
      log.textContent = (data.log || 'error').substring(0, 1000);
      preview.hidden = true;
    }
  } catch(e) {
    log.textContent = 'Error: ' + e.message;
  }
}
function clearLatex() {
  document.getElementById('latex-area').value = '';
  document.getElementById('latex-log').textContent = '';
  document.getElementById('latex-preview').hidden = true;
}

// ---- WebSocket (events) ----
function connectEventWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  evtWs = new WebSocket(`${proto}//${location.hostname}:8743/ws/events`);
  evtWs.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'stats') {
        // update title bar stat
      }
    } catch(_) {}
  };
  evtWs.onclose = () => setTimeout(connectEventWs, 3000);
}

// ---- utilities ----
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Build a clickable row without ever putting untrusted text into an HTML
// string. text/title go through textContent + setAttribute (never parsed as
// markup), and the handler is a real closure (never an onclick attribute), so
// a filename or title containing quotes or <script> cannot execute.
function entry(cls, text, onClick, opts) {
  opts = opts || {};
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  if (opts.title != null) div.setAttribute('title', opts.title);
  if (opts.style) div.style.cssText = opts.style;
  if (opts.active) div.classList.add('active');
  if (onClick) {
    div.style.cursor = div.style.cursor || 'pointer';
    div.addEventListener('click', onClick);
  }
  return div;
}

// ---- keyboard shortcuts ----
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); document.getElementById('chat-input').focus(); }
  if (e.key === 'Escape') { togglePanel(); }
});
/* PWA service worker — offline shell, never caches /api/ or SSE */
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
