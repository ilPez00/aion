<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aion HUD</title>
<!-- PWA: installable web HUD (Add to Home Screen -> standalone app) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5ad1ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AION">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/hud.css">
</head>
<body>
<div id="app">

  <!-- ── rail: modules + always-on vitals ─────────────────────────────── -->
  <nav id="rail" aria-label="Modules">
    <div id="brand"><span>AION</span></div>
    <div id="nav" role="tablist"></div>
    <div id="vitals" aria-label="System vitals">
      <div class="vital"><span class="k">CPU</span><span class="meter"><i id="m-cpu"></i></span><span class="v" id="v-cpu">–</span></div>
      <div class="vital"><span class="k">RAM</span><span class="meter"><i id="m-mem"></i></span><span class="v" id="v-mem">–</span></div>
      <div class="vital"><span class="k">DSK</span><span class="meter"><i id="m-dsk"></i></span><span class="v" id="v-dsk">–</span></div>
      <div class="vital"><span class="k">GPU</span><span class="meter"><i id="m-gpu"></i></span><span class="v" id="v-gpu">–</span></div>
    </div>
  </nav>

  <!-- ── workspace ────────────────────────────────────────────────────── -->
  <div id="work">
    <div id="topbar">
      <h2 id="module-title">FILES</h2>

      <div id="graph-tools" class="row">
        <button id="pal-open" type="button" title="Search everything (Ctrl-K)">Search <kbd>^K</kbd></button>
        <button id="view-toggle" type="button" aria-pressed="false" title="Show list view"></button>
        <button id="fit" type="button" title="Fit graph to screen (0)">Fit</button>
        <button id="refresh" type="button" title="Rescan (r)">Refresh</button>
        <label class="sr-only" for="search">Filter nodes</label>
        <input id="search" type="search" placeholder="filter… (/)" style="max-width:180px">
      </div>

      <div id="fs-tools" class="row" hidden>
        <label class="sr-only" for="roots">Bookmarked directory</label>
        <select id="roots" title="Jump to a bookmarked directory"></select>
        <label class="sr-only" for="dir">Directory to scan</label>
        <input id="dir" type="text" placeholder="/absolute/path" style="min-width:200px">
        <label class="sr-only" for="depth">Scan depth</label>
        <select id="depth" title="Scan depth">
          <option value="1">depth 1</option>
          <option value="2">depth 2</option>
          <option value="3" selected>depth 3</option>
          <option value="5">depth 5</option>
        </select>
        <label class="row mono-sm muted" style="gap:6px">
          <input id="hidden" type="checkbox" style="min-height:auto;width:16px;height:16px"> hidden
        </label>
      </div>

      <span class="grow"></span>
      <span id="live-dot" class="live-dot" title="offline — polling" aria-hidden="true"></span>
      <span id="status" class="muted" role="status" aria-live="polite">booting…</span>
    </div>

    <nav id="crumbs" aria-label="Directory path" hidden></nav>

    <div id="stage">
      <div id="canvas-wrap">
        <!-- The graph. role=application + tabindex makes arrow-key traversal
             reachable; #graph-desc is the live text description, and the
             list view (below) is the real accessible peer. -->
        <canvas id="graph-canvas" tabindex="0" role="application"
                aria-label="Organic relationship graph"
                aria-describedby="graph-desc"></canvas>
        <p id="graph-desc" class="sr-only" role="status" aria-live="polite"></p>
        <div id="focus-badge" role="status" hidden></div>
        <div id="legend" aria-hidden="true"></div>
        <div id="hint">drag · scroll zoom · click a hub to isolate · 0 fit</div>

        <!-- accessible twin of the graph -->
        <div id="list-view"></div>

        <!-- non-graph modules mount here -->
        <div id="panel-view">
          <div id="chat-root" style="display:flex;flex-direction:column;min-height:0;height:100%">
            <div id="messages" role="log" aria-label="Agent conversation" aria-live="polite"></div>
            <div id="composer">
              <label class="sr-only" for="chat-input">Message the agent</label>
              <input id="chat-input" type="text" placeholder="Message Aion…" autocomplete="off">
              <button id="voice-btn" type="button" aria-pressed="false" aria-label="Voice input">MIC</button>
              <button id="send" type="button" class="primary">Send</button>
            </div>
          </div>
          <div id="latex-root" hidden style="padding:16px;overflow:auto;width:100%">
            <label class="sr-only" for="latex-area">LaTeX source</label>
            <textarea id="latex-area" placeholder="\documentclass{article}
\begin{document}
Hello
\end{document}"></textarea>
            <div class="row" style="margin-top:12px">
              <button id="latex-compile" type="button" class="primary">Compile</button>
              <span id="latex-log" class="muted mono-sm"></span>
            </div>
            <iframe id="latex-preview" title="Compiled PDF" hidden
                    style="width:100%;height:60vh;margin-top:12px;border:1px solid var(--border);border-radius:8px;background:#fff"></iframe>
          </div>
        </div>
      </div>

      <!-- ── inspector ──────────────────────────────────────────────── -->
      <aside id="inspector" aria-label="Selection inspector">
        <div class="pane row">
          <h3 style="flex:1;margin:0">Inspector</h3>
          <button id="inspector-close" type="button" style="display:none" aria-label="Close inspector">✕</button>
        </div>
        <div class="pane">
          <h3>Selection</h3>
          <div id="sel-body"><p class="muted">Select a node.</p></div>
          <div id="open-box" hidden style="margin-top:12px">
            <button id="open-editor" type="button">Open in editor</button>
          </div>
          <div id="move-box" hidden style="margin-top:12px">
            <label class="mono-sm muted" for="dest">Rename / move to</label>
            <div class="row" style="margin-top:6px">
              <input id="dest" type="text" spellcheck="false">
              <button id="move" type="button">Move</button>
            </div>
          </div>
        </div>
        <div class="pane" id="preview-pane">
          <h3>Preview</h3>
          <pre id="preview">—</pre>
        </div>
      </aside>
    </div>
  </div>
</div>

<!-- Command palette: one search across modules, harnesses, tasks, task logs,
     notes, filenames and file contents. Ctrl-K, same as the TUI cockpit. -->
<div id="palette" hidden>
  <div id="pal-box" role="combobox" aria-expanded="true" aria-haspopup="listbox"
       aria-owns="pal-list">
    <div id="pal-head">
      <label class="sr-only" for="pal-input">Search everything</label>
      <input id="pal-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="search files, tasks, notes, harnesses…"
             aria-controls="pal-list" aria-autocomplete="list">
      <span id="pal-count" class="muted mono-sm"></span>
    </div>
    <div id="pal-list" role="listbox" aria-label="Search results"></div>
    <div id="pal-foot" class="muted mono-sm">
      <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>⏎</kbd> jump · <kbd>esc</kbd> close
    </div>
  </div>
</div>

<script src="/static/organic.js"></script>
<script src="/static/hud.js"></script>
</body>
</html>
