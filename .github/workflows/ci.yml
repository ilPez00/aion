name: ci

# The suite and the secret scan were both things somebody had to remember to
# run. On a solo repo that means they run right up until the week they matter.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `web` is included because the HUD transport tests import it. The
          # hardware extras (deck, ring, voice) are deliberately absent: every
          # one of them is meant to soft-fail when its dependency is missing,
          # and CI is the only place that is checked for free.
          pip install -e ".[dev,web]"

      - name: Lint
        # Before the tests, because the failures it catches are the ones tests
        # structurally cannot: an undefined name inside a branch nobody covers,
        # sitting behind a bare `except Exception: pass`. Four of those were
        # live in the tree the day this step was added. The ruleset is narrow
        # on purpose — see the comment in pyproject.toml.
        run: python -m ruff check src/ tests/ scripts/

      - name: Tests
        # test_term.py drives a real pty and is excluded everywhere, including
        # in AGENTS.md's factory gates. Excluding it here keeps CI and the
        # local gate the same command.
        run: python -m pytest tests/ --ignore=tests/test_term.py -q

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan a push range rather than a snapshot.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        # This job had no install step, so every run of it since it was
        # written ended in "No module named pytest" — 25 of 25 red. The rules
        # below are the ones that stop a blind `git add -A` from sweeping
        # credentials into a commit, and they had never once executed here.
        # `[dev]` rather than bare pytest so this resolves the same way the
        # tests job does.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Staged-content rules
        # The same rules the pre-commit hook applies, run against the pushed
        # commits. A hook can be skipped with --no-verify or simply not
        # enabled in a fresh clone; this cannot.
        run: python -m pytest tests/test_commit_guard.py -q
